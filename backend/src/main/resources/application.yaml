spring:
  application:
    name: dispute-portal
  main:
    # A banner line would break one-JSON-object-per-line log shipping.
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # Unset DB_URL means standalone mode: in-memory H2 that behaves like PostgreSQL. Data is lost on restart.
    url: ${DB_URL:jdbc:h2:mem:disputes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    # The API docs are public on purpose, so springdoc's "disable in production" reminders would only bury the
    # one startup warning that matters in standalone mode.
    org.springdoc.core.events.SpringDocAppInitializer: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  demo:
    # Demo value for the seeded customers. Override it for any shared deployment.
    password: ${APP_DEMO_PASSWORD:demo-password}
  dispute:
    window-days: ${APP_DISPUTE_WINDOW_DAYS:120}

---
# Structured JSON logs everywhere except a developer machine that opts in with the "local" profile.
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: ecs
